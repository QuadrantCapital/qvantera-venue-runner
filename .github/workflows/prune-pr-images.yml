name: prune-pr-images

# The pre-merge e2e (M-411) pushes a `pr-<n>` tag per image per pull request and nothing
# deletes it, so GHCR would grow three image versions per pull request forever. A pull request
# older than a week is either merged or abandoned; either way its images have done their job.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: [self-hosted, qvantera]
    timeout-minutes: 10
    steps:
      - name: Delete pr-* image versions older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: venue-runner
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '7 days ago' +%s)
          # `all(startswith("pr-"))` and not `any`: a version that also carries :latest or a
          # :sha tag is a release artifact that happens to have been reused, and must survive.
          gh api --paginate "/orgs/QuadrantCapital/packages/container/${PACKAGE}/versions" \
            --jq '.[] | select((.metadata.container.tags | length) > 0)
                      | select(.metadata.container.tags | all(startswith("pr-")))
                      | "\(.id) \(.updated_at)"' |
          while read -r id updated; do
            if [ "$(date -u -d "${updated}" +%s)" -lt "${cutoff}" ]; then
              gh api -X DELETE "/orgs/QuadrantCapital/packages/container/${PACKAGE}/versions/${id}"
              echo "deleted ${PACKAGE} version ${id} (${updated})"
            fi
          done
